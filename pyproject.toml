[project]
name = "tether"
version = "0.1.0"
description = "Evidence-backed claim review for student applications."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "pydantic-settings>=2.5.0",
  "jinja2>=3.1.4", "python-multipart>=0.0.9", "openai>=1.40.0",
  "pypdf>=5.0.0", "python-docx>=1.1.2", "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3", "weasyprint>=62.3", "rank-bm25>=0.2.2"
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.4.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI dependency markers are intentionally declared as parameter defaults.
# The pipeline catches broad provider failures to preserve degraded results.
ignore = ["B008", "BLE001", "S110"]
